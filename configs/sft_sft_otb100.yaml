bf16: True
seed: 42
num_train_epochs: 1
max_steps: 2000
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 1
evaluation_strategy: "no"
save_strategy: "steps"
save_steps: 24000
save_total_limit: 1
learning_rate: 0.001
weight_decay: 0.
warmup_ratio: 0.03
lr_scheduler_type: "cosine"
logging_steps: 1
tf32: True
gradient_checkpointing: true
dataloader_num_workers: 0
report_to: "none"
run_name: elysium-7b-otb100
output_dir: /home/stackops/dhviet/Elysium-GRPO/checkpoints/sft_sft_otb100
eval_dir: /home/stackops/dhviet/Elysium-GRPO/outputs/sft_sft_otb100
deepspeed: ./configs/zero2.json

model:
  pretrained_model_name_or_path: /home/stackops/dhviet/Elysium-GRPO/checkpoints/sft_otb100
  trained_model_name_or_path: /home/stackops/dhviet/Elysium-GRPO/checkpoints/sft_sft_otb100

data:
  train:
    data_fetch:
      data_paths: [{
          "anno_path": /home/stackops/dhviet/OTB100_Elysium/train/annotation.jsonl,
          "image_folder": /home/stackops/dhviet/OTB100_Elysium
        }]
      batch_sizes: [32]
      num_workers: 0
      num_readers: [4]
      key_mapping:

    data_preprocess:
      sample_method: random_clip  
      with_visual: True
      frames_key: frames
      label_key: vqa
      task_type: vqa
      tokenizer: lmsys/vicuna-7b-v1.5
      max_seq_len: 100000
      max_prompt_len: 256
      vqa_processor_params:
        box_format: ours_v1
      num_segments: 10
      verbose: True
      frames_ops:
        Resize:
          size: [336, 336]
        ToTensor: {}
        Normalize:
          mean: [0.48145466, 0.4578275, 0.40821073]
          std: [0.26862954, 0.26130258, 0.27577711]
      online_vqa_processor_params:
        task: SOT

  predict:
    data_fetch:
      anno_path: /home/stackops/dhviet/OTB100_Elysium/test/annotation.jsonl
      image_folder: /home/stackops/dhviet/OTB100_Elysium
      batch_sizes: [1]
      num_workers: 1
      num_readers: [2]
      key_mapping:

    data_preprocess:
      with_visual: True
      frames_key: frames
      sample_method: random_clip
      label_key: "vqa"
      task_type: vqa
      tokenizer: lmsys/vicuna-7b-v1.5
      max_seq_len: 512
      max_prompt_len: 256
      vqa_processor_params:
        box_format: ours_v1
      online_vqa_processor_params:
        task: SOT
      num_segments: 1
      verbose: True
      training: False
      frames_ops:
        Resize:
          size: [336, 336]
        ToTensor: {}
        Normalize:
          mean: [0.48145466, 0.4578275, 0.40821073]
          std: [0.26862954, 0.26130258, 0.27577711]
